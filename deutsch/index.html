<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Deutsch Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root {
  --bg1: #ffe6f2; --bg2: #e6e4ff; --card: #ffffff; --ink: #3a2d5c; --ink-soft: #7a6c9c; --line: #eadff7;
  --pink: #ff8fc1; --pink-d: #e9659f; --lav: #b9a6ff; --mint: #7fdcb6; --sun: #ffd25e; --sky: #8cc8ff;
  --t-red: #ff5d7d; --t-blue: #4e9bff; --t-yellow: #f6b830; --t-green: #35c48a;
  --der: #3b6fd8; --die: #d8434f; --das: #2f9a5c; --plural: #d98a1c;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: linear-gradient(160deg, var(--bg1), var(--bg2)); color: var(--ink); font-family: var(--body); touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
input { -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 18px; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border-radius: 24px; box-shadow: 0 6px 0 var(--line), 0 10px 30px rgba(90,60,160,.08); padding: 16px; }
.btn { font-family: var(--display); font-weight: 800; font-size: 20px; border-radius: 18px; padding: 12px 22px; background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-d); transition: transform .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-d); }
.btn.big { font-size: 26px; padding: 16px 30px; }
.btn.soft { background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--line); }
.btn.mint { background: var(--t-green); box-shadow: 0 5px 0 #23935f; }
.btn.lav { background: #8f78f0; box-shadow: 0 5px 0 #6b52d6; }
.row { display: flex; gap: 10px; align-items: center; }
.muted { color: var(--ink-soft); }
.center { text-align: center; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.der { color: var(--der); } .die { color: var(--die); } .das { color: var(--das); } .pl { color: var(--plural); }

/* ---------- Home ---------- */
.home-top { display: flex; align-items: center; gap: 10px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 32px; box-shadow: 0 4px 0 var(--line); flex: none; }
.gear { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.7); font-size: 22px; position: relative; }
.gear .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid var(--pink); clip-path: inset(0 100% 0 0); }
.gear.holding .ring { animation: ring 1.6s linear forwards; }
@keyframes ring { to { clip-path: inset(0 0 0 0); } }
.hero { text-align: center; margin: 8px 0 4px; }
.hero svg { width: 120px; height: 120px; animation: bob 2.6s ease-in-out infinite; }
.hero h1 { font-size: clamp(34px, 8vw, 52px); color: #8f5bd9; text-shadow: 0 3px 0 #fff; }
.hero p { margin: 2px 0 0; font-weight: 700; color: var(--ink-soft); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.mode { border-radius: 24px; padding: 14px 12px; color: #fff; text-align: left; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; transition: transform .08s; }
.mode:active { transform: scale(.97); }
.mode .ic { font-size: 34px; }
.mode b { font-family: var(--display); font-size: 22px; line-height: 1.05; }
.mode small { font-weight: 700; opacity: .92; font-size: 13px; }
.mode .bar { height: 7px; border-radius: 9px; background: rgba(255,255,255,.35); margin-top: 6px; overflow: hidden; }
.mode .bar i { display: block; height: 100%; background: #fff; border-radius: 9px; }
.mode.m-articles { background: linear-gradient(135deg, #ff7aa8, #ff9a7a); box-shadow: 0 6px 0 #d9567f; }
.mode.m-verbes { background: linear-gradient(135deg, #5aa2ff, #7f8bff); box-shadow: 0 6px 0 #4167d6; }
.mode.m-vocab { background: linear-gradient(135deg, #3cc98f, #5fd3c4); box-shadow: 0 6px 0 #26a072; }
.mode.m-grammaire { background: linear-gradient(135deg, #f7b52c, #ff9452); box-shadow: 0 6px 0 #d2861a; }
.mode.m-mix { grid-column: 1 / -1; background: linear-gradient(135deg, #a77cff, #ff7ad0); box-shadow: 0 6px 0 #8350d8; min-height: 84px; flex-direction: row; align-items: center; gap: 12px; }
.mode .new { position: absolute; top: 10px; right: 10px; background: #fff; color: var(--pink-d); font-weight: 800; font-size: 12px; border-radius: 999px; padding: 2px 8px; }
.home-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.tile { background: #fff; border-radius: 20px; padding: 12px; box-shadow: 0 5px 0 var(--line); display: flex; align-items: center; gap: 10px; font-weight: 800; text-align: left; }
.tile .ic { font-size: 30px; }
.tile.glow { box-shadow: 0 5px 0 var(--pink-d), 0 0 0 3px var(--pink); animation: wiggle 1.2s ease-in-out infinite; }

/* ---------- Lobby ---------- */
.lobby { text-align: center; justify-content: center; gap: 18px; }
.lobby h2 { font-size: 30px; }
.players { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.pl-card { background: #fff; border-radius: 20px; padding: 10px 12px; width: 108px; box-shadow: 0 5px 0 var(--line); animation: pop .4s ease both; }
.pl-card .em { font-size: 44px; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; }
.pl-card b { display: block; font-family: var(--display); font-size: 18px; margin-top: 4px; }
.pl-card small { color: var(--ink-soft); font-weight: 700; font-size: 12px; }
.pl-card.me { outline: 4px solid var(--pink); }
.count { font-family: var(--display); font-size: 140px; color: #fff; text-shadow: 0 8px 0 #c79bff; animation: pop .5s ease; }

/* ---------- Question ---------- */
.q-screen { padding-top: 10px; gap: 10px; }
.q-top { display: flex; align-items: center; gap: 8px; }
.q-top .x { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.7); font-size: 18px; font-weight: 800; }
.timer { height: 14px; border-radius: 9px; background: rgba(255,255,255,.7); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--t-green), var(--sun)); border-radius: 9px; transform-origin: left; }
.timer.low i { background: var(--t-red); }
.clock { width: 52px; height: 52px; border-radius: 50%; background: #8f78f0; color: #fff; font-family: var(--display); font-size: 26px; display: grid; place-items: center; box-shadow: 0 4px 0 #6b52d6; flex: none; }
.clock.low { background: var(--t-red); box-shadow: 0 4px 0 #c43a59; animation: wiggle .5s infinite; }
.bots { display: flex; gap: 8px; justify-content: center; }
.bot { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: #fff; opacity: .55; transition: opacity .2s, transform .2s; }
.bot.done { opacity: 1; transform: scale(1.08); }
.bot.done::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--t-green); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
.prompt { flex: 1; min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; position: relative; animation: pop .35s ease; }
.prompt .kind { position: absolute; top: 10px; left: 12px; font-size: 13px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.prompt .badge-new { position: absolute; top: 8px; right: 10px; background: var(--pink); color: #fff; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 3px 10px; animation: wiggle 1s ease-in-out infinite; }
.prompt .emo { font-size: clamp(56px, 14vw, 96px); line-height: 1; }
.prompt .main { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 7vw, 46px); line-height: 1.15; }
.prompt .sentence { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 6vw, 38px); line-height: 1.25; }
.prompt .hint { font-weight: 700; color: var(--ink-soft); font-size: clamp(16px, 3.6vw, 20px); }
.blank { display: inline-block; width: 2.4em; height: .9em; border-bottom: 4px dashed var(--lav); margin: 0 .15em; vertical-align: baseline; }
.pron { display: inline-block; background: #efe8ff; color: #6b52d6; border-radius: 12px; padding: 0 10px; }
.pron small { font-size: .5em; color: var(--ink-soft); font-family: var(--body); margin-left: 4px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answers.three { grid-template-columns: 1fr 1fr 1fr; }
.answers.list { grid-template-columns: 1fr; }
.ans { position: relative; min-height: 84px; border-radius: 18px; color: #fff; font-family: var(--display); font-weight: 800; font-size: clamp(20px, 5vw, 30px); padding: 10px 10px 10px 42px; text-align: left; display: flex; align-items: center; line-height: 1.1; transition: transform .08s, opacity .25s; word-break: break-word; }
.answers.three .ans { padding: 10px; justify-content: center; text-align: center; min-height: 110px; font-size: clamp(24px, 6vw, 36px); }
.answers.list .ans { min-height: 60px; font-size: clamp(17px, 4.2vw, 24px); }
.ans:active { transform: scale(.97); }
.ans .sh { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 20px; opacity: .85; }
.answers.three .ans .sh { left: 10px; top: 14px; transform: none; font-size: 16px; }
.c0 { background: var(--t-red); box-shadow: 0 5px 0 #c43a59; }
.c1 { background: var(--t-blue); box-shadow: 0 5px 0 #2f6fcc; }
.c2 { background: var(--t-yellow); box-shadow: 0 5px 0 #c98e12; }
.c3 { background: var(--t-green); box-shadow: 0 5px 0 #23935f; }
.cder { background: var(--der); box-shadow: 0 5px 0 #24499a; }
.cdie { background: var(--die); box-shadow: 0 5px 0 #a02a33; }
.cdas { background: var(--das); box-shadow: 0 5px 0 #1f6b3f; }
.ans.dim { opacity: .3; }
.ans.right { outline: 5px solid #fff; box-shadow: 0 0 0 9px var(--t-green); }
.ans.wrong { animation: shake .4s; }
.ans .mark { position: absolute; right: 10px; top: 8px; font-size: 22px; }
.typebox { display: flex; flex-direction: column; gap: 10px; }
.typebox input { font-family: var(--display); font-weight: 700; font-size: 28px; padding: 12px 16px; border-radius: 18px; border: 4px solid var(--lav); outline: none; background: #fff; color: var(--ink); width: 100%; }
.typebox input:focus { border-color: var(--pink); }
.typebox .keys { display: flex; gap: 8px; }
.typebox .keys button { flex: 1; font-family: var(--display); font-size: 26px; font-weight: 800; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 4px 0 var(--line); }
.typebox.wrongtype input { border-color: var(--t-red); animation: shake .4s; }
.typebox.righttype input { border-color: var(--t-green); }

/* ---------- Feedback sheet ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(58,45,92,.25); display: flex; align-items: flex-end; justify-content: center; z-index: 20; animation: fadeIn .2s; }
.sheet { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: #fff; border-radius: 28px 28px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .3s ease; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.verdict { display: flex; align-items: center; gap: 12px; }
.verdict .big { font-size: 46px; }
.verdict h2 { font-size: 30px; }
.verdict.ok h2 { color: var(--t-green); }
.verdict.ko h2 { color: var(--t-red); }
.verdict.almost h2 { color: var(--t-yellow); }
.points { margin-left: auto; font-family: var(--display); font-size: 26px; font-weight: 800; color: #8f78f0; }
.answer-line { margin: 10px 0 4px; font-family: var(--display); font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.say { width: 40px; height: 40px; border-radius: 50%; background: #efe8ff; font-size: 20px; flex: none; }
.tip { background: #fff7e0; border-radius: 16px; padding: 10px 12px; font-weight: 700; font-size: 16px; line-height: 1.35; margin: 8px 0; }
.tip b { font-weight: 800; }
.conj { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 17px; margin-top: 6px; }
.conj span:nth-child(odd) { color: var(--ink-soft); }
.conj .hl { background: #ffe0ef; border-radius: 6px; padding: 0 4px; color: var(--pink-d); font-weight: 800; }
.board { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 12px; }
.brow { display: flex; align-items: center; gap: 8px; background: #f6f2ff; border-radius: 14px; padding: 6px 10px; font-weight: 800; }
.brow.me { background: #ffe3f1; outline: 3px solid var(--pink); }
.brow .rk { width: 22px; font-family: var(--display); color: var(--ink-soft); }
.brow .em { font-size: 24px; }
.brow .sc { margin-left: auto; font-family: var(--display); }
.brow .mv { width: 18px; font-size: 13px; }
.mv.up { color: var(--t-green); } .mv.down { color: var(--t-red); }

/* ---------- End ---------- */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 16px 0 8px; }
.pod { display: flex; flex-direction: column; align-items: center; width: 31%; max-width: 160px; }
.pod .em { font-size: 50px; animation: bob 2s ease-in-out infinite; }
.pod b { font-family: var(--display); font-size: 18px; }
.pod .blk { width: 100%; border-radius: 16px 16px 0 0; display: grid; place-items: start center; padding-top: 8px; font-family: var(--display); font-size: 34px; color: #fff; font-weight: 800; animation: grow .7s ease both; transform-origin: bottom; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.pod.p1 .blk { height: 150px; background: linear-gradient(#ffd25e, #f6a92a); }
.pod.p2 .blk { height: 110px; background: linear-gradient(#c9d3e6, #a1aec7); }
.pod.p3 .blk { height: 80px; background: linear-gradient(#f2b48a, #d98a5c); }
.pod.me b { color: var(--pink-d); }
.result-msg { text-align: center; }
.result-msg h1 { font-size: clamp(32px, 8vw, 46px); color: #8f5bd9; }
.stars-row { font-size: 38px; letter-spacing: 4px; text-align: center; }
.mist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.mist div { background: #f6f2ff; border-radius: 12px; padding: 8px 10px; font-weight: 700; }
.mist div b { color: var(--t-green); }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -40px; font-style: normal; font-size: 26px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* ---------- Reward / drawing ---------- */
.idea { background: linear-gradient(135deg, #fff, #fff1f8); border: 3px dashed var(--pink); border-radius: 24px; padding: 16px; text-align: center; }
.idea .emo { font-size: 60px; }
.idea .de { font-family: var(--display); font-size: clamp(24px, 6vw, 34px); font-weight: 800; color: #8f5bd9; }
.idea .fr { font-weight: 700; font-size: 18px; margin-top: 4px; }
.idea .extra { margin-top: 8px; font-weight: 700; color: var(--ink-soft); }
.swatches { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.swatches i { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
.draw-screen { padding: 8px 10px 10px; gap: 8px; }
.draw-head { display: flex; align-items: center; gap: 8px; }
.draw-head .idea-mini { flex: 1; background: #fff; border-radius: 16px; padding: 6px 10px; font-weight: 800; font-size: 15px; line-height: 1.2; min-width: 0; }
.draw-head .idea-mini small { display: block; font-weight: 700; color: var(--ink-soft); font-size: 13px; }
.canvas-wrap { flex: 1; min-height: 0; background: #fff; border-radius: 20px; box-shadow: 0 5px 0 var(--line); overflow: hidden; position: relative; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
.tools .t { width: 46px; height: 46px; border-radius: 14px; background: #fff; font-size: 22px; box-shadow: 0 3px 0 var(--line); display: grid; place-items: center; }
.tools .t.on { background: #ffe3f1; outline: 3px solid var(--pink); }
.colors { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; -webkit-overflow-scrolling: touch; justify-content: safe center; }
.colors button { flex: none; width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.colors button.on { outline: 4px solid var(--ink); outline-offset: 2px; }
.dot { border-radius: 50%; background: var(--ink); display: block; }
.stamps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.stamps button { font-size: 26px; width: 44px; height: 44px; border-radius: 12px; background: #fff; }
.stamps button.on { outline: 3px solid var(--pink); }

/* ---------- Gallery ---------- */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.gal button { background: #fff; border-radius: 16px; padding: 6px; box-shadow: 0 4px 0 var(--line); }
.gal img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; display: block; }
.gal small { display: block; font-weight: 700; font-size: 12px; margin-top: 4px; color: var(--ink-soft); }
.viewer img { width: 100%; border-radius: 16px; display: block; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }

/* ---------- Parents ---------- */
.parent h3 { margin: 16px 0 8px; font-size: 22px; }
.set { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid #f3edfb; font-weight: 700; flex-wrap: wrap; }
.set label { flex: 1; min-width: 160px; }
.seg { display: inline-flex; background: #f3edfb; border-radius: 12px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 10px; font-weight: 800; background: transparent; }
.seg button.on { background: #fff; box-shadow: 0 2px 0 var(--line); }
.parent input[type=text] { font: inherit; font-weight: 800; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); }
table.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
table.stats td, table.stats th { text-align: left; padding: 5px 6px; border-bottom: 1px solid #f3edfb; }
table.stats th { color: var(--ink-soft); font-size: 12px; text-transform: uppercase; }
.acc { display: inline-block; min-width: 44px; text-align: center; border-radius: 8px; padding: 1px 6px; font-weight: 800; }
.choose-av { display: flex; flex-wrap: wrap; gap: 8px; }
.choose-av button { font-size: 30px; width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 var(--line); }
.choose-av button.on { outline: 4px solid var(--pink); }

@media (min-width: 700px) {
  .modes { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .mode { min-height: 150px; }
  .mode.m-mix { min-height: 90px; }
  .ans { min-height: 110px; }
  .answers.three .ans { min-height: 140px; }
}
@media (max-height: 560px) {
  .prompt { min-height: 110px; }
  .prompt .emo { font-size: 48px; }
  .ans { min-height: 60px; }
  .answers.three .ans { min-height: 70px; }
  .hero svg { width: 80px; height: 80px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script src="app.js"></script>
<script>
// Garde une copie du jeu sur l'appareil pour qu'il marche sans internet.
