<title>Alinka's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen 3D world with floating cloud-soft HUD; mini-games open as cards over the world.
   Single deliberate look (pastel sky world), same in light and dark hosts. */
:root {
  --sky: #cfe9ff;
  --cloud: #ffffff;
  --ink: #2c3a63;
  --ink-soft: #5d6a92;
  --blue: #6fb2f2;
  --pink: #ff8fbf;
  --mint: #7fdcb6;
  --sun: #ffd25e;
  --ick: #9ccc3a;
  --line: #dbe7f7;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
button { font-family: var(--display); font-weight: 700; color: var(--ink); cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* HUD */
.hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.score { background: var(--cloud); border-radius: 22px; padding: 6px 16px 8px; box-shadow: 0 4px 0 var(--line); display: grid; }
.score b { font-family: var(--display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.hud-btns { display: flex; gap: 8px; }
.round { background: var(--cloud); width: 50px; height: 50px; border-radius: 50%; font-size: 24px; box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; position: relative; }
.round:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.round .ring { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid transparent; }
#hint { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 84px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); padding: 6px 16px; border-radius: 16px; font-weight: 800; font-size: 15px; max-width: calc(100% - 32px); text-align: center; z-index: 4; pointer-events: none; transition: opacity .3s; }
#act { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); background: var(--sun); font-size: 20px; padding: 12px 26px; border-radius: 30px; box-shadow: 0 5px 0 #e0a92b; z-index: 5; max-width: calc(100% - 200px); min-width: 150px; text-align: center; line-height: 1.15; }
#act.info { background: var(--cloud); box-shadow: 0 5px 0 var(--line); font-size: 16px; cursor: default; }
#act small { display: block; font-size: 13px; opacity: .75; }
#act:active:not(.info) { transform: translate(-50%, 3px); box-shadow: 0 2px 0 #e0a92b; }
#joy { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.45); border: 3px solid rgba(255,255,255,.8); touch-action: none; z-index: 5; }
#joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--cloud); box-shadow: 0 3px 0 var(--line); }
.keys { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 12px; color: var(--ink-soft); font-weight: 700; background: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 10px; z-index: 4; }
kbd { font-family: var(--body); background: var(--cloud); border-radius: 5px; padding: 0 5px; box-shadow: 0 2px 0 var(--line); }

/* Overlay cards */
#ov { position: fixed; inset: 0; background: rgba(44,58,99,.35); display: grid; place-items: center; z-index: 10; padding: calc(env(safe-area-inset-top,0px) + 12px) max(12px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px, env(safe-area-inset-left,0px)); }
.card { background: var(--cloud); border-radius: 28px; width: min(680px, 100%); max-height: 100%; overflow: auto; padding: 18px 22px 22px; position: relative; box-shadow: 0 8px 0 rgba(44,58,99,.15); }
.card h2 { font-family: var(--display); font-size: 28px; margin: 0 40px 6px 0; line-height: 1.15; text-wrap: balance; }
.x { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: #eef4fc; font-size: 18px; }
.hint { margin: 0 0 12px; font-weight: 700; color: var(--ink-soft); }
.sub { margin: 10px 0 0; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.big-btn { background: var(--sun); font-size: 20px; padding: 10px 24px; border-radius: 24px; box-shadow: 0 4px 0 #e0a92b; }
.big-btn.alt { background: #eef4fc; box-shadow: 0 4px 0 var(--line); }
.big-btn.pink { background: var(--pink); color: #fff; box-shadow: 0 4px 0 #d96b9b; }
.big-btn:disabled { opacity: .5; cursor: not-allowed; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.bar { height: 14px; background: #eef4fc; border-radius: 8px; overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; width: 100%; background: var(--mint); border-radius: 8px; transition: width .2s linear; }

/* quiz */
.q { text-align: center; }
.q .prompt { font-family: var(--display); font-size: 44px; font-weight: 800; margin: 6px 0 4px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.q .prompt.emoji { font-size: 84px; }
.q .prompt.long { font-size: 24px; font-weight: 700; text-wrap: balance; }
.q .why { min-height: 24px; margin: 10px 0 0; font-weight: 800; color: #d9506f; }
.q .ask { font-weight: 700; color: var(--ink-soft); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.opts button { background: #eef4fc; font-size: 22px; padding: 14px 8px; border-radius: 18px; box-shadow: 0 4px 0 var(--line); min-width: 0; overflow-wrap: anywhere; }
.opts button.right { background: var(--mint); }
.opts button.wrong { background: #ffc2c2; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #eef4fc; }
.dots i.ok { background: var(--mint); } .dots i.no { background: #ff9c9c; } .dots i.now { background: var(--blue); }

/* teeth */
.mouth { background: #d9506f; border-radius: 120px 120px 140px 140px; padding: 26px 18px; display: grid; gap: 30px; touch-action: none; position: relative; }
.teeth { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.tooth { aspect-ratio: 3/4; background: #fffdf6; border-radius: 10px 10px 16px 16px; position: relative; max-width: 100%; }
.teeth.bot .tooth { border-radius: 16px 16px 10px 10px; }
.germ { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(22px, 6vw, 38px); cursor: pointer; transition: transform .1s; animation: wig .6s infinite alternate ease-in-out; }
@keyframes wig { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
.bubble { position: absolute; pointer-events: none; font-size: 22px; animation: up .7s forwards; }
@keyframes up { to { transform: translateY(-50px); opacity: 0; } }

/* wipe */
.wipe { position: relative; border-radius: 20px; overflow: hidden; touch-action: none; aspect-ratio: 16/10; max-width: 100%; }
.wipe canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* pack / dress */
.timetable { background: #eef4fc; border-radius: 18px; padding: 10px 14px; font-weight: 800; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { background: var(--cloud); padding: 4px 12px; border-radius: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.tile { background: #f5f8fd; border-radius: 16px; padding: 8px 4px; font-size: 14px; display: grid; justify-items: center; gap: 2px; box-shadow: 0 3px 0 var(--line); border: 3px solid transparent; }
.tile span { font-size: 34px; line-height: 1.1; }
.tile.on { border-color: var(--blue); background: #e3f1ff; }
.tile.shake { animation: shake .4s 2; border-color: #ff8a8a; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.cat { font-family: var(--display); font-weight: 800; margin: 14px 0 0; font-size: 18px; }
.msg { min-height: 24px; text-align: center; font-weight: 800; color: #d9506f; margin-top: 10px; }

/* friend games */
.fg { width: 100%; border-radius: 20px; touch-action: none; display: block; max-width: 100%; aspect-ratio: 600/420; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mem button { aspect-ratio: 1; border-radius: 16px; font-size: clamp(26px, 8vw, 44px); background: #3b2f4d; color: #fff; box-shadow: 0 4px 0 #22192f; max-width: 100%; }
.mem button.open { background: #fff0f8; box-shadow: 0 4px 0 #f3c8de; }
.mem button.done { background: var(--mint); box-shadow: none; }

/* cooking */
.bowl { font-size: 80px; text-align: center; line-height: 1.2; }
.tile:disabled { opacity: .6; cursor: default; }
.whisk { height: 200px; background: #fff4e6; border-radius: 24px; display: grid; place-items: center; align-content: center; touch-action: none; cursor: grab; font-size: 96px; }
.whisk span { display: block; line-height: 1; }
.whisk small { font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.scale { background: #fff4e6; border-radius: 24px; padding: 14px; display: grid; justify-items: center; gap: 2px; }
.scale span { font-size: 60px; line-height: 1.1; }
.scale b { font-family: var(--display); font-size: 48px; font-variant-numeric: tabular-nums; background: #2c3a63; color: #b8f5d8; border-radius: 14px; padding: 0 18px; min-width: 6ch; text-align: center; }
.scale small { font-weight: 800; color: var(--ink-soft); }
#pour { touch-action: none; -webkit-touch-callout: none; }
.oven { background: #ffb3cf; border-radius: 24px; padding: 18px; }
.ovwin { background: #3b2f4d; border-radius: 16px; height: 170px; display: grid; place-items: center; box-shadow: inset 0 0 40px #ff9a3c; }
.ovwin span { font-size: 80px; display: block; }
.meter { position: relative; height: 22px; background: #eef4fc; border-radius: 11px; margin: 16px 0 6px; }
.meter .zone { position: absolute; left: 62%; width: 20%; top: 0; bottom: 0; background: var(--mint); }
.meter .mark { position: absolute; top: -8px; width: 0; height: 0; margin-left: -10px; border: 10px solid transparent; border-top: 14px solid var(--ink); }
.cupcake { width: 150px; height: 160px; margin: 8px auto 0; position: relative; }
.cupcake .frost { position: absolute; top: 16px; left: 10px; width: 130px; height: 84px; border-radius: 70px 70px 24px 24px; transition: background .2s; }
.cupcake .liner { position: absolute; bottom: 0; left: 18px; width: 114px; height: 72px; background: repeating-linear-gradient(90deg, #ffd25e 0 12px, #ffeaa8 12px 24px); clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%); }
.cupcake .topper { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 40px; }

/* celebrate / lists */
.yay { text-align: center; }
.yay .pts { font-family: var(--display); font-size: 64px; font-weight: 800; color: #e7a91c; line-height: 1; }
.ickm { font-size: 22px; letter-spacing: 2px; }
.ickm .off { opacity: .2; }
.tasklist { display: grid; gap: 8px; margin-top: 8px; }
.trow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: #f5f8fd; border-radius: 16px; padding: 8px 10px; }
.trow > span:first-child { font-size: 30px; text-align: center; }
.trow .nm { font-weight: 800; min-width: 0; }
.trow .nm small { display: block; font-weight: 700; color: var(--ink-soft); font-size: 13px; }
.trow.done { background: #e4f8ef; }
.trow button { background: var(--cloud); padding: 6px 12px; border-radius: 14px; box-shadow: 0 3px 0 var(--line); font-size: 15px; white-space: nowrap; }
.legend { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin: 4px 0 0; }
.parent { display: grid; gap: 14px; }
.parent section { background: #f5f8fd; border-radius: 16px; padding: 12px; }
.parent h3 { margin: 0 0 8px; font-family: var(--display); font-size: 18px; }
.parent textarea, .parent input { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 12px; border-radius: 10px; border: 2px solid var(--line); padding: 8px; color: var(--ink); background: var(--cloud); -webkit-user-select: text; user-select: text; }
.parent input { font-family: var(--body); font-size: 15px; }
.parent .row-btns { justify-content: flex-start; margin-top: 8px; }
.parent .big-btn { font-size: 15px; padding: 6px 14px; }
.logl { font-size: 13px; max-height: 140px; overflow: auto; margin: 0; padding-left: 18px; }
.confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 20; pointer-events: none; animation: fall 1.6s linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti, .germ { animation: none; } .confetti { display: none; } }
@media (max-width: 520px) {
  #act { max-width: calc(100% - 32px); bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); font-size: 18px; }
  .card { padding: 14px 14px 18px; } .card h2 { font-size: 23px; }
  .q .prompt { font-size: 36px; } .opts button { font-size: 19px; }
  .keys { display: none; }
}
</style>

<div id="stage"></div>
<div class="hud">
  <div class="score"><b id="pts">0 ⭐</b><span id="today">Today: 0 tasks</span></div>
  <div class="hud-btns">
    <button class="round" id="btnTasks" title="My tasks" aria-label="My tasks">📋</button>
    <button class="round" id="btnSnd" title="Sound" aria-label="Sound on or off">🔊</button>

</div>

<script>
/* =====================================================================

const CONFIG = {

  playCost: 10,           // stars it costs to play with a friend

  tasks: [
    { id: 'room',   name: 'Clean up my messy room',   icon: '🧸', ick: 5, points: 60, game: 'carry', items: 'mess',  drop: [-2, -8.3], where: 'Bedroom', dropName: 'the toy box' },
    { id: 'trash',  name: 'Take out the stinky trash', icon: '🗑️', ick: 5, points: 55, game: 'carry', items: 'trash', drop: [6, 8.7],  where: 'Kitchen → garden bin', dropName: 'the green bin outside' },
    { id: 'table',  name: 'Wipe the sticky table',     icon: '🧽', ick: 4, points: 45, game: 'wipe',  at: [0, 3.45],  where: 'Kitchen' },

    { id: 'math',   name: 'Maths : × et :',            icon: '🔢', ick: 3, points: 35, game: 'quiz', subject: 'math', at: DESK, where: 'Study desk' },

const LANG = { fr: { col: 1, name: 'French', voice: 'fr-FR' }, en: { col: 2, name: 'English', voice: 'en-GB' }, de: { col: 3, name: 'German', voice: 'de-DE' } };

/* ---------------- save / load ---------------- */
const SAVE_KEY = 'alinka-save-v1';
function freshState() {
  return { v: 1, points: 0, earned: 0, day: '', done: {}, friends: {}, buddy: null,

GAMES.chop = (t, el, done) => {

  const c = el.querySelector('canvas'), g = c.getContext('2d');
  let items = [], halves = [], fx = [], trail = [], score = 0, worms = 0, down = false, spawnT = 0, raf, over = false;
  let t0 = null, last = null;
  const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * (600 / r.width), (e.clientY - r.top) * (420 / r.height)]; };
  const cut = (x, y) => {
    for (const it of items) {
      if (it.cut || Math.hypot(it.x - x, it.y - y) > 40) continue;
      it.cut = true;
      if (it.worm) { worms++; score = Math.max(0, score - 1); snd('bad'); fx.push({ x: it.x, y: it.y, s: 'Ewww! 🤢', t: 0.9 }); }

    }
  };
  const addPt = (e) => {
    const p = pos(e), prev = trail[trail.length - 1];
    if (prev && performance.now() - prev[2] < 150) { const steps = Math.ceil(Math.hypot(p[0] - prev[0], p[1] - prev[1]) / 15); for (let k = 1; k <= steps; k++) cut(prev[0] + (p[0] - prev[0]) * k / steps, prev[1] + (p[1] - prev[1]) * k / steps); }
    else cut(p[0], p[1]);
    trail.push([p[0], p[1], performance.now()]);
  };
  c.addEventListener('pointerdown', (e) => { down = true; trail = []; try { c.setPointerCapture(e.pointerId); } catch (_) {} addPt(e); });
  c.addEventListener('pointermove', (e) => { if (down || e.pointerType === 'mouse') addPt(e); });
  const up = () => (down = false); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  const loop = (now) => {
    if (over) return;

    const dt = Math.min(0.05, (now - last) / 1000); last = now; const el2 = (now - t0) / 1000;
    spawnT -= dt; if (spawnT <= 0) { spawnT = rnd(0.55, 0.95); const x = rnd(90, 510); items.push({ x, y: 450, vx: (300 - x) * rnd(0.2, 0.5), vy: -rnd(560, 660), worm: Math.random() < 0.18, e: pick(FRUIT) }); }
    const grad = g.createLinearGradient(0, 0, 0, 420); grad.addColorStop(0, '#ffe7c7'); grad.addColorStop(1, '#f6cf9f'); g.fillStyle = grad; g.fillRect(0, 0, 600, 420);
    g.strokeStyle = 'rgba(180,120,60,.18)'; g.lineWidth = 4; for (let y = 60; y < 420; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(600, y); g.stroke(); }
    items.forEach((it) => { it.vy += 620 * dt; it.x += it.vx * dt; it.y += it.vy * dt; if (!it.cut) drawE(g, it.worm ? '🐛' : it.e, it.x, it.y, 56); });
    items = items.filter((it) => !it.cut && it.y < 470);
    halves.forEach((h) => {
      h.vy += 620 * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.r += h.side * dt * 4; h.t -= dt;
      g.save(); g.translate(h.x, h.y); g.rotate(h.r); g.beginPath(); g.rect(h.side < 0 ? -40 : 0, -40, 40, 80); g.clip(); drawE(g, h.e, 0, 0, 56); g.restore();
    });
    halves = halves.filter((h) => h.t > 0);
    const tr = trail.filter((p) => now - p[2] < 150); trail = tr;
    if (tr.length > 1) { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(tr[0][0], tr[0][1]); tr.forEach((p) => g.lineTo(p[0], p[1])); g.stroke(); }
    fx.forEach((p) => { p.t -= dt; p.y -= 50 * dt; g.fillStyle = '#2c3a63'; g.font = '800 26px "Baloo 2", sans-serif'; g.textAlign = 'center'; g.fillText(p.s, p.x, p.y); }); fx = fx.filter((p) => p.t > 0);
    drawE(g, '🥗', 550, 375, 56); g.fillStyle = '#2c3a63'; g.font = '800 24px "Baloo 2", sans-serif'; g.textAlign = 'center'; g.fillText(`${score}/${GOAL}`, 550, 320);
    $('fgs').textContent = `Chopped ${score} · ${Math.max(0, Math.ceil(TIME - el2))}s`;

    if (t0 === null) t0 = last = now; // time from the animation clock itself (Safari's can differ from performance.now)
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const el2 = (now - t0) / 1000;
    spawnT -= dt; if (spawnT <= 0) { spawnT = rnd(0.35, 0.7); items.push({ x: rnd(50, 550), y: rnd(60, 380), life: Math.max(0.8, 1.6 - el2 * 0.03), age: 0 }); }
    const g = G.g; g.fillStyle = G.grad; g.fillRect(0, 0, 600, 420);
    g.fillStyle = 'rgba(120,180,90,.35)'; for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(50 + k * 100, 400, 70, 30, 0, 0, 7); g.fill(); }
    items.forEach((it) => { it.age += dt; it.life -= dt; const s = it.got ? 60 + (0.25 - it.life) * 200 : Math.min(1, it.age * 5) * 52; g.globalAlpha = it.got ? Math.max(0, it.life * 4) : 1; G.emoji(it.got ? '✨' : f.game.item, it.x, it.y, s); g.globalAlpha = 1; });
    items = items.filter((it) => it.life > 0);
    $('fgs').textContent = `Found ${score} · ${Math.max(0, Math.ceil(TIME - el2))}s`;
    if (el2 >= TIME) { over = true; return done(score + ' found', score >= 20); }
    if (!over) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  return () => { over = true; cancelAnimationFrame(raf); };
};
FGAMES.memory = (f, el, done) => {
  const cards = shuffle([...f.game.cards, ...f.game.cards]); let open = [], moves = 0, pairs = 0, busy = false;
  el.innerHTML = `<p class="hint">Find the matching pairs. ${f.name} is watching… 👀</p><div class="mem">${cards.map((c, k) => `<button data-k="${k}" aria-label="card">?</button>`).join('')}</div><p class="sub" id="fgs">Moves 0</p>`;
  const btns = [...el.querySelectorAll('.mem button')];
  btns.forEach((b) => b.addEventListener('click', () => {
    const k = +b.dataset.k; if (busy || b.classList.contains('open') || b.classList.contains('done')) return;
    b.classList.add('open'); b.textContent = cards[k]; open.push(k); snd('pick');
    if (open.length === 2) {
      moves++; $('fgs').textContent = `Moves ${moves}`;
      const [a, c] = open;
      if (cards[a] === cards[c]) { btns[a].classList.add('done'); btns[c].classList.add('done'); open = []; pairs++; snd('coin'); if (pairs === f.game.cards.length) setTimeout(() => done(moves + ' moves', moves <= 12), 500); }
      else { busy = true; setTimeout(() => { [a, c].forEach((i) => { btns[i].classList.remove('open'); btns[i].textContent = '?'; }); open = []; busy = false; }, 800); }
    }
  }));
};

    else { const s = stationFor(t); guide = { x: s.x, z: s.z, task: t.id }; }

});
$('btnSnd').addEventListener('click', () => { state.sound = !state.sound; save(); updateHUD(); snd('pop'); });

let holdT = null;
const pb = $('btnParent'), ring = $('holdRing');
const holdStart = (e) => { e.preventDefault(); ring.style.transition = 'border-color 2s'; ring.style.borderColor = '#ff8fbf'; holdT = setTimeout(openParent, 2000); };
const holdEnd = () => { clearTimeout(holdT); ring.style.transition = 'none'; ring.style.borderColor = 'transparent'; };
pb.addEventListener('pointerdown', holdStart); pb.addEventListener('pointerup', holdEnd); pb.addEventListener('pointerleave', holdEnd); pb.addEventListener('pointercancel', holdEnd);
pb.addEventListener('click', () => { if (paused) return; hint('Grown-ups: press and hold ⚙️ for 2 seconds.'); });
pb.addEventListener('contextmenu', (e) => e.preventDefault());

function openParent() {

    <section><h3>Recent stars</h3><ol class="logl">${state.log.slice(0, 25).map((l) => `<li>${l.t}: ${l.text} (${l.pts > 0 ? '+' : ''}${l.pts})</li>`).join('') || '<li>Nothing yet</li>'}</ol></section>

  }));

  $('pCopy').addEventListener('click', () => { const ta = $('pCode'); navigator.clipboard?.writeText(ta.value).then(() => ($('pMsg').textContent = 'Copied.'), () => { ta.select(); $('pMsg').textContent = 'Selected. Press Ctrl+C or Cmd+C to copy.'; }) ?? (ta.select()); });
  $('pLoad').addEventListener('click', () => {

    catch (e) { $('pMsg').textContent = 'That code did not work. Paste the whole code you copied before.'; }

  let armed = false;

/* ======================= MAIN LOOP ======================= */
const clock = new THREE.Clock(); let T = 0;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

function tick() {
  requestAnimationFrame(tick);
  if (paused) { clock.getDelta(); return; } // the world waits while a card is open, so mini-games run smoothly
  const dt = Math.min(0.05, clock.getDelta()); T += dt;
  // movement
  let ix = 0, iy = 0;
  if (!paused) {
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1; if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    ix += joy.x; iy += joy.y;
  }
  const il = Math.hypot(ix, iy), moving = il > 0.08;
  if (moving) {
    const k = Math.min(1, il) / il, fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
    const dx = (fx * iy + rx * ix) * k, dz = (fz * iy + rz * ix) * k;
    player.x += dx * player.speed * dt; player.z += dz * player.speed * dt; collide(player, 0.32);
    const target = Math.atan2(dx, dz); let d = target - player.rot; d = Math.atan2(Math.sin(d), Math.cos(d)); player.rot += d * Math.min(1, dt * 12);
  }
  const A = alinka; A.group.position.set(player.x, 0, player.z); A.group.rotation.y = player.rot;
  const wk = moving ? T * 13 : 0;
  A.body.position.y = moving ? Math.abs(Math.sin(wk)) * 0.07 : Math.sin(T * 2) * 0.015;
  A.feet[0].position.z = 0.04 + (moving ? Math.sin(wk) * 0.13 : 0); A.feet[1].position.z = 0.04 - (moving ? Math.sin(wk) * 0.13 : 0);
  A.ears.forEach((e, i) => { const s = i ? 1 : -1; e.rotation.z = s * -0.38 + s * (moving ? Math.sin(wk * 0.9) * 0.28 : Math.sin(T * 2.5) * 0.06); });
  A.arms.forEach((a, i) => { a.position.z = 0.06 + (moving ? Math.sin(wk + i * Math.PI) * 0.08 : 0); });

  // carrying mess
  floorItems.forEach((fi) => { fi.obj.userData.sp.position.y = 0.55 + Math.sin(T * 3 + fi.x) * 0.06; if (fi.obj.userData.flies) fi.obj.userData.flies.forEach((f, i) => f.position.set(Math.cos(T * 4 + i * 2) * 0.5, 0.8 + Math.sin(T * 6 + i) * 0.15, Math.sin(T * 4 + i * 2) * 0.5)); });
  if (!paused) {
    for (const fi of floorItems.slice()) {
      if (carried.length >= 3) break;
      if (Math.hypot(fi.x - player.x, fi.z - player.z) < 0.85) {
        floorItems.splice(floorItems.indexOf(fi), 1); scene.remove(fi.obj);
        const o = emojiSprite(fi.e, 0.5); A.group.add(o); carried.push({ task: fi.task, obj: o }); snd('pick');
        const t = fi.task;
        hint(t.items === 'trash' ? 'Pee-yew! 🤢 Bring it to the green bin in the garden.' : carried.length >= 3 ? `Hands full! Bring it to ${t.dropName}.` : `Got it! ${carryLeft(t) - carried.filter((c) => c.task === t).length} more on the floor.`);
        if (guide && guide.follow === 'mess') { const nx = floorItems.find((x) => x.task === t); guide = carried.length >= 3 || !nx ? { x: t.drop[0], z: t.drop[1], task: t.id } : { x: nx.x, z: nx.z, task: t.id, follow: 'mess' }; }
        else if (guide && guide.task === t.id) guide = { x: t.drop[0], z: t.drop[1], task: t.id };
      }
    }
    CONFIG.tasks.filter((t) => t.game === 'carry').forEach((t) => {
      if (!carried.some((c) => c.task === t) || Math.hypot(t.drop[0] - player.x, t.drop[1] - player.z) > 1.6) return;
      for (let i = carried.length - 1; i >= 0; i--) if (carried[i].task === t) { A.group.remove(carried[i].obj); carried.splice(i, 1); }
      const left = carryLeft(t);
      if (!left) award(t, 1, t.items === 'mess' ? 'Your room is tidy! (For now…)' : 'The stinky trash is gone! 🌸');
      else { snd('coin'); hint(`${left} more to pick up!`); if (guide && guide.task === t.id) { const nx = floorItems.find((x) => x.task === t); if (nx) guide = { x: nx.x, z: nx.z, task: t.id, follow: 'mess' }; } }
    });
  }
  carried.forEach((c, i) => c.obj.position.set(0, 1.75 + i * 0.42 + Math.sin(T * 5 + i) * 0.03, 0));

  // friends
  CONFIG.friends.forEach((f) => {
    const o = friendObjs[f.id], buddy = state.buddy === f.id;
    let tx = f.home[0], tz = f.home[1];
    if (buddy) { tx = player.x - Math.sin(player.rot) * 1.3 + Math.cos(player.rot) * 0.7; tz = player.z - Math.cos(player.rot) * 1.3 - Math.sin(player.rot) * 0.7; }
    const dx = tx - o.pos.x, dz = tz - o.pos.z, dist = Math.hypot(dx, dz);
    if (buddy && dist > 9) { o.pos.x = tx; o.pos.z = tz; }
    const walking = dist > 0.15 && dist <= 9;
    if (walking) { const sp = Math.min(dist, (buddy ? 5 : 3) * dt); o.pos.x += (dx / dist) * sp; o.pos.z += (dz / dist) * sp; if (!o.fly) collide(o.pos, 0.3); o.group.rotation.y = Math.atan2(dx, dz); }
    else { const pd = Math.hypot(player.x - o.pos.x, player.z - o.pos.z); if (pd < 5) { let d = Math.atan2(player.x - o.pos.x, player.z - o.pos.z) - o.group.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); o.group.rotation.y += d * Math.min(1, dt * 4); } }
    o.group.position.set(o.pos.x, o.fly ? 1.6 + Math.sin(T * 2) * 0.15 : 0, o.pos.z);
    o.body.position.y = walking ? Math.abs(Math.sin(T * 12)) * 0.08 : Math.abs(Math.sin(T * 1.6 + f.cost)) * 0.03;
    if (o.wings) o.wings.forEach((w) => (w.wp.rotation.y = w.s * Math.sin(T * 14 + w.ph) * 0.7));
    if (o.tail) o.tail.rotation.x = Math.sin(T * 3) * 0.12;
    o.label.visible = !buddy;
  });
  steam.forEach((s) => { const p = (T * 0.4 + s.userData.ph) % 1.5; s.position.y = 0.3 + p * 1.2; s.material.opacity = 0.6 * (1 - p / 1.5); });
  clouds.forEach((c) => { c.position.x += dt * 0.4; if (c.position.x > 45) c.position.x = -45; });
  butterflies.forEach((b) => { const a = T * b.sp + b.ph; b.s.position.set(b.cx + Math.cos(a) * b.r, 1.1 + Math.sin(T * 2.3 + b.ph) * 0.4, b.cz + Math.sin(a * 1.3) * b.r); b.s.scale.x = 0.55 * (0.25 + Math.abs(Math.cos(T * 11 + b.ph)) * 0.75); });
  for (let i = 0; i < PETALS; i++) { const k = i * 3; petalPos[k + 1] -= dt * (0.35 + (i % 5) * 0.06); petalPos[k] += Math.sin(T + i) * dt * 0.3; if (petalPos[k + 1] < 0.02) petalPos[k + 1] = 9; }
  petalGeo.attributes.position.needsUpdate = true;

  // stations shimmer
  stations.forEach((s, i) => { s.icon.position.y = 1.9 + Math.sin(T * 2.4 + i) * 0.1; const sc = 1 + Math.sin(T * 3 + i) * 0.05; s.ring.scale.set(sc, sc, 1); });

  // guide arrow
  if (guide && Math.hypot(guide.x - player.x, guide.z - player.z) < 0.01) guide = null;
  if (guide) {
    const dx = guide.x - player.x, dz = guide.z - player.z, d = Math.hypot(dx, dz);
    arrow.visible = d > 1.8; arrow.position.set(player.x + (dx / d) * 0.9, 1.5 + Math.sin(T * 5) * 0.05, player.z + (dz / d) * 0.9); arrow.rotation.y = Math.atan2(dx, dz);
    if (d < 1.2 && !guide.follow) guide = null;
  } else arrow.visible = false;

  // interaction prompt
  if (!paused) { const n = findNearby(); const key = n ? (n.kind === 'friend' ? 'f' + n.f.id : 's' + n.s.key) + carried.length + state.points : ''; if (key !== (nearby && nearby._k)) { nearby = n; if (nearby) nearby._k = key; renderAct(); } }
  else if (nearby) { nearby = null; }

  // camera
  const ch = Math.sin(camPitch) * camDist, cd = Math.cos(camPitch) * camDist;
  const cx = player.x + Math.sin(camYaw) * cd, cz = player.z + Math.cos(camYaw) * cd, cy = 0.9 + ch;
  const k = 1 - Math.exp(-dt * 8);
  camera.position.x += (cx - camera.position.x) * k; camera.position.y += (cy - camera.position.y) * k; camera.position.z += (cz - camera.position.z) * k;
  camera.lookAt(player.x, 0.9, player.z);
  renderer.render(scene, camera);
}

/* ======================= BOOT ======================= */
// If something breaks, say so on screen instead of showing a blank page.
addEventListener('error', (e) => { try { hint('Oops, something went wrong: ' + (e.message || 'unknown error'), 9000); } catch (_) {} });
function boot(data) {
  if (data && data.state) state = migrate(data.state);
  if (data && typeof data.px === 'number') { player.x = data.px; player.z = data.pz; camYaw = data.yaw || 0; }
  if (state.day !== todayStr()) { state.day = todayStr(); state.done = {}; save(); }
  applyOutfit(); spawnCarry(); refreshStations(); refreshFriendLabels(); updateHUD(); resize();
  camera.position.set(player.x, 4, player.z + 6);
  tick();
  if (!state.seenIntro) intro();
  else hint('Welcome back, Alinka! Tap 📋 to see your tasks.', 3500);
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ state, px: player.x, pz: player.z, yaw: camYaw })); } catch (e) {}
  // re-check the day every minute (the game might stay open overnight)
  setInterval(() => { if (state.day !== todayStr() && !paused) { state.day = todayStr(); state.done = {}; save(); spawnCarry(); refreshStations(); updateHUD(); hint('A new day! ☀️ Your room got messy again…'); } }, 60000);
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude && window.claude.hot && window.claude.hot.data || {});
</script>
